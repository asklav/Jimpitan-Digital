<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Base Plate Gradient (Luxury Metallic Edge) -->
    <linearGradient id="plateEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="50%" stop-color="#fda085" />
      <stop offset="100%" stop-color="#b8860b" />
    </linearGradient>

    <!-- Glass/Digital Plate Fill -->
    <linearGradient id="plateFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Gold Foil & High Metallic Gradient -->
    <linearGradient id="gold3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89c" />
      <stop offset="25%" stop-color="#f5af19" />
      <stop offset="50%" stop-color="#e65c00" />
      <stop offset="75%" stop-color="#f5af19" />
      <stop offset="100%" stop-color="#fff1b0" />
    </linearGradient>

    <!-- Light Gold Surface -->
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f5af19" />
      <stop offset="100%" stop-color="#fff5c0" />
    </linearGradient>

    <!-- Digital Cyan Accent Gradient -->
    <linearGradient id="digitalCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Holographic Digital Wave -->
    <linearGradient id="holoWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>

    <!-- Shadows -->
    <!-- Deep Drop Shadow for Embossed 3D Effect -->
    <filter id="shadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Glowing Effect for Digital Elements -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Inner Shadow for Embossed/Timbul Detail -->
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="linear" slope="0.7" />
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feOffset dx="0" dy="4" />
      <feComposite operator="out" in2="SourceAlpha" result="inverse" />
      <feFlood flood-color="#000" result="color" />
      <feComposite operator="in" in2="inverse" result="shadow" />
      <feComposite operator="over" in2="SourceGraphic" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Outer Digital Circuit Glow Rays -->
  <g opacity="0.3" stroke="url(#digitalCyan)" stroke-width="1.5" stroke-dasharray="4 8" fill="none">
    <circle cx="256" cy="256" r="210" />
    <circle cx="256" cy="256" r="190" />
    <path d="M 256,30 L 256,60 M 256,452 L 256,482 M 30,256 L 60,256 M 452,256 L 482,256" />
  </g>

  <!-- MAIN 3D EMBOSSED BASE CONTAINER (Rounded Squircle Badge) -->
  <g filter="url(#shadow3D)">
    <!-- 3D Bevel Edge (Bottom Layer) -->
    <rect x="64" y="68" width="384" height="384" rx="80" fill="url(#plateEdge)" />
    <!-- Top Face Plate -->
    <rect x="64" y="64" width="384" height="384" rx="80" fill="url(#plateFill)" stroke="url(#plateEdge)" stroke-width="3" />
  </g>

  <!-- Digital Tech Grid overlay on Container -->
  <g opacity="0.15">
    <path d="M100 160 H412 M100 220 H412 M100 280 H412 M100 340 H412 M100 400 H412" stroke="#ffffff" stroke-width="1" />
    <path d="M160 100 V412 M220 100 V412 M280 100 V412 M340 100 V412 M400 100 V412" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- DIGITAL JIMPITAN BOWL / BUBONG (3D Embossed Container) -->
  <g filter="url(#shadow3D)">
    <!-- Bowl Outer Glow / Shadow Base -->
    <path d="M 140 280 C 140 370, 372 370, 372 280 Z" fill="#0c1322" />
    
    <!-- 3D Layer (Depth/Thickness) -->
    <path d="M 136 270 C 136 375, 376 375, 376 270 C 376 360, 136 360, 136 270 Z" fill="url(#gold3D)" />
    
    <!-- Main Bowl Body -->
    <path d="M 140 265 C 140 360, 372 360, 372 265 L 350 265 C 350 335, 162 335, 162 265 Z" fill="url(#goldLight)" />

    <!-- Bowl Front Holographic Digital Rim -->
    <ellipse cx="256" cy="265" rx="116" ry="28" fill="url(#plateFill)" stroke="url(#gold3D)" stroke-width="6" />
    <ellipse cx="256" cy="265" rx="104" ry="20" fill="#0f172a" opacity="0.8" />
  </g>

  <!-- DIGITAL NODES / CIRCUITS ON THE BOWL (Representing "Digital Social Security/Jimpitan") -->
  <g filter="url(#cyanGlow)" stroke="url(#digitalCyan)" stroke-width="2.5" fill="none">
    <path d="M 180 300 Q 256 340 332 300" />
    <path d="M 210 320 Q 256 345 302 320" />
    <!-- Connection Dots -->
    <circle cx="180" cy="300" r="4" fill="#00f2fe" />
    <circle cx="256" cy="326" r="4" fill="#00f2fe" />
    <circle cx="332" cy="300" r="4" fill="#00f2fe" />
  </g>

  <!-- 3D EMBOSSED COINS FLOATING INTO BOWL (Jimpitan Donation/Savings Action) -->
  
  <!-- Coin 1: Background Small Coin -->
  <g filter="url(#shadow3D)" transform="translate(180, 190) rotate(-15)">
    <ellipse cx="0" cy="8" rx="28" ry="28" fill="#b8860b" />
    <circle cx="0" cy="0" r="28" fill="url(#gold3D)" />
    <circle cx="0" cy="0" r="22" fill="url(#goldLight)" stroke="#e65c00" stroke-width="1.5" />
    <text x="0" y="7" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#8b4513" text-anchor="middle">Rp</text>
  </g>

  <!-- Coin 2: Right Floating Coin -->
  <g filter="url(#shadow3D)" transform="translate(320, 175) rotate(20)">
    <ellipse cx="0" cy="8" rx="32" ry="32" fill="#b8860b" />
    <circle cx="0" cy="0" r="32" fill="url(#gold3D)" />
    <circle cx="0" cy="0" r="25" fill="url(#goldLight)" stroke="#e65c00" stroke-width="1.5" />
    <text x="0" y="8" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#8b4513" text-anchor="middle">Rp</text>
  </g>

  <!-- Coin 3: Center Main Big 3D Coin (Hero Element) -->
  <g filter="url(#shadow3D)" transform="translate(256, 140)">
    <!-- 3D Thickness Side -->
    <path d="M -45,0 L -45,12 A 45 45 0 0 0 45,12 L 45,0 Z" fill="#a65100" />
    <path d="M -45,0 L -45,8 A 45 45 0 0 0 45,8 L 45,0 Z" fill="url(#gold3D)" />
    <!-- Main Coin Face -->
    <circle cx="0" cy="0" r="45" fill="url(#gold3D)" />
    <circle cx="0" cy="0" r="36" fill="url(#goldLight)" stroke="#f5af19" stroke-width="2" />
    <!-- Inner Coin Pattern -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="#e65c00" stroke-width="1.5" stroke-dasharray="6 3" />
    <!-- Currency / Hand Symbol in Center -->
    <text x="0" y="11" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="900" font-size="32" fill="#7a3200" text-anchor="middle" filter="url(#innerShadow)">Rp</text>
  </g>

  <!-- DIGITAL HAND / GESTURE (Pinching / "Ngemprit" / "Jimpit" Concept) -->
  <!-- Stylized Digital Glowing Pinching Hand Icon Floating Above -->
  <g filter="url(#cyanGlow)">
    <!-- Drop Sparkles / Digital Bits falling to bowl -->
    <circle cx="256" cy="205" r="4" fill="#00f2fe" />
    <circle cx="240" cy="225" r="3" fill="#4facfe" />
    <circle cx="270" cy="220" r="3.5" fill="#00f2fe" />
    <circle cx="256" cy="240" r="2.5" fill="#ffffff" />
  </g>

  <!-- ELEGANT SHINE & LIGHTING EFFECTS (Timbul/Glass Highlights) -->
  <!-- Top Left Curved Reflection on Main Badge -->
  <path d="M 110 80 Q 256 65 370 80 C 410 80 420 100 420 120 Q 256 95 92 130 C 92 100 100 80 110 80 Z" fill="#ffffff" opacity="0.15" />

  <!-- Digital Connectivity Sparks / Stars -->
  <g fill="#ffffff" filter="url(#goldGlow)">
    <!-- Sparkle 1 -->
    <path d="M 120 160 Q 120 175 105 175 Q 120 175 120 190 Q 120 175 135 175 Q 120 175 120 160 Z" />
    <!-- Sparkle 2 -->
    <path d="M 390 220 Q 390 230 380 230 Q 390 230 390 240 Q 390 230 400 230 Q 390 230 390 220 Z" />
    <!-- Sparkle 3 -->
    <path d="M 340 100 Q 340 112 328 112 Q 340 112 340 124 Q 340 112 352 112 Q 340 112 340 100 Z" />
  </g>

  <!-- Bottom Elegant Label Banner "JIMPITAN DIGITAL" -->
  <g filter="url(#shadow3D)">
    <!-- Banner Base -->
    <rect x="116" y="390" width="280" height="50" rx="25" fill="url(#plateFill)" stroke="url(#gold3D)" stroke-width="2.5" />
    <!-- Inner Glow Line -->
    <rect x="120" y="394" width="272" height="42" rx="21" fill="none" stroke="url(#digitalCyan)" stroke-width="1" opacity="0.5" />
    <!-- Text -->
    <text x="256" y="423" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" font-weight="800" font-size="19" fill="url(#goldLight)" letter-spacing="3" text-anchor="middle" filter="url(#goldGlow)">
      JIMPITAN DIGITAL
    </text>
  </g>
</svg>